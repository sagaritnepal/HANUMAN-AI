# /etc/nginx/sites-available/callagent
# After: sudo ln -s /etc/nginx/sites-available/callagent /etc/nginx/sites-enabled/
#        sudo certbot --nginx -d calls.yourdomain.com.np
server {
    listen 80;
    server_name calls.yourdomain.com.np;    # ← change to your domain

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (/ws/chat, /portal/ws/test-chat)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
